services:
  - type: web
    name: mtg-crm
    env: node
    buildCommand: "npm install --production"
    startCommand: "node dist/index.cjs"
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: NODE_VERSION
        value: 20.18.0
